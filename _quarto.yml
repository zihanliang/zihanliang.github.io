project:
  type: website
  output-dir: docs
  pre-render:
    - node scripts/render-static-content.mjs
  post-render:
    - node scripts/post-render-seo.mjs
  resources:
    - CNAME
    - data/**
    - fonts/**
    - figures/**
    - icon/**
    - notes/**
    - pdf/**

website:
  title: "Zihan Liang"
  description: "Zihan Liang is a Ph.D. student at Duke University researching reliable machine learning, causal inference, multimodal learning, and clinical data."
  site-url: "https://www.zihanliang.com"
  favicon: icon/favicon-32x32.png
  search: false
  navbar:
    pinned: true
    right:
      - text: "Home"
        href: index.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Research"
        href: research.qmd
      - text: "Experiences"
        href: experiences.qmd
      - text: "Demos"
        href: demo.qmd
      - text: "Study Notes"
        href: notes.qmd
  page-footer:
    center: "Computational Biology and Bioinformatics Program, Duke University | zihan.liang@duke.edu <br><a href=\"zh.html\">中文</a> | © 2026 Zihan Liang. All rights reserved."

format:
  html:
    toc: false
    anchor-sections: false
    canonical-url: true
    theme: default
    css: assets/css/style.css
    include-in-header: assets/includes/head-icons.html
    include-after-body: assets/includes/nav-scroll.html
