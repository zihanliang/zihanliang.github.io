name: Deploy Quarto Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Compile CV from LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          working_directory: zihan_liang_academic_cv
          latexmk_use_xelatex: true

      - name: Generate CV first-page preview
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdftoppm \
            -f 1 \
            -l 1 \
            -singlefile \
            -r 200 \
            -png \
            zihan_liang_academic_cv/cv.pdf \
            zihan_liang_academic_cv/cv-first-page
          test "$(pdfinfo zihan_liang_academic_cv/cv.pdf | awk '/^Pages:/ { print $2 }')" -eq 2
          test -s zihan_liang_academic_cv/cv-first-page.png

      # Quarto resolves include directives before project pre-render hooks.
      # Generate the ignored fragments explicitly for a clean CI checkout.
      - name: Generate Static HTML from JSON
        run: node scripts/render-static-content.mjs

      - name: Render Site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
