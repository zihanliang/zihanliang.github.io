<script>
(function () {
  const MOBILE_NAV_QUERY = window.matchMedia('(max-width: 991.98px)')
  const MOBILE_NAV_EXIT_MS = 280
  const MOBILE_NAV_SCENE_EXIT_MS = 220
  let lockedScrollY = 0
  let mobileNavReleaseTimer = 0
  let mobileNavSceneReleaseTimer = 0

  function withNextPaint(callback) {
    window.requestAnimationFrame(callback)
  }

  function clearMobileNavReleaseTimer() {
    if (!mobileNavReleaseTimer) return

    window.clearTimeout(mobileNavReleaseTimer)
    mobileNavReleaseTimer = 0
  }

  function clearMobileNavSceneReleaseTimer() {
    if (!mobileNavSceneReleaseTimer) return

    window.clearTimeout(mobileNavSceneReleaseTimer)
    mobileNavSceneReleaseTimer = 0
  }

  function getEffectiveScrollY() {
    return document.body.style.position === 'fixed' ? lockedScrollY : window.scrollY
  }

  function setMobileNavVisible(visible) {
    const root = document.documentElement

    if (visible) {
      root.classList.add('mobile-nav-visible')
      return
    }

    root.classList.remove('mobile-nav-visible')
  }

  function setMobileNavSceneActive(active) {
    const root = document.documentElement

    if (active) {
      clearMobileNavSceneReleaseTimer()
      root.classList.add('mobile-nav-scene-active')
      return
    }

    root.classList.remove('mobile-nav-scene-active')
  }

  function syncNavState() {
    if (document.documentElement.classList.contains('mobile-nav-open')) {
      return
    }

    const scrolled = getEffectiveScrollY() > 8;
    if (scrolled) {
      document.documentElement.classList.add('nav-scrolled');
    } else {
      document.documentElement.classList.remove('nav-scrolled');
    }
  }

  function isMobileViewport() {
    return MOBILE_NAV_QUERY.matches
  }

  function getNavbarCollapse() {
    return document.getElementById('navbarCollapse')
  }

  function lockPageScroll() {
    if (document.body.style.position === 'fixed') return

    lockedScrollY = window.scrollY
    document.body.style.position = 'fixed'
    document.body.style.top = `-${lockedScrollY}px`
    document.body.style.left = '0'
    document.body.style.right = '0'
    document.body.style.width = '100%'
  }

  function unlockPageScroll() {
    if (document.body.style.position !== 'fixed') return

    const restoredScrollY = lockedScrollY
    document.body.style.position = ''
    document.body.style.top = ''
    document.body.style.left = ''
    document.body.style.right = ''
    document.body.style.width = ''
    window.scrollTo(0, restoredScrollY)
    lockedScrollY = 0
    withNextPaint(syncNavState)
  }

  function setMobileNavOpen(open) {
    const root = document.documentElement

    if (open) {
      clearMobileNavReleaseTimer()
      setMobileNavSceneActive(true)
      root.classList.add('mobile-nav-open')
      return
    }

    clearMobileNavReleaseTimer()
    clearMobileNavSceneReleaseTimer()
    setMobileNavSceneActive(false)
    root.classList.remove('mobile-nav-open')
    setMobileNavVisible(false)
    syncNavState()
  }

  function releaseMobileNavScene() {
    clearMobileNavSceneReleaseTimer()
    setMobileNavSceneActive(false)
  }

  function finalizeMobileNavClose() {
    clearMobileNavReleaseTimer()
    releaseMobileNavScene()
    setMobileNavOpen(false)
    unlockPageScroll()
  }

  function scheduleMobileNavRelease() {
    clearMobileNavReleaseTimer()
    mobileNavReleaseTimer = window.setTimeout(finalizeMobileNavClose, MOBILE_NAV_EXIT_MS)
  }

  function scheduleMobileNavSceneRelease() {
    clearMobileNavSceneReleaseTimer()
    mobileNavSceneReleaseTimer = window.setTimeout(releaseMobileNavScene, MOBILE_NAV_SCENE_EXIT_MS)
  }

  function closeMobileNav() {
    const collapse = getNavbarCollapse()
    if (!collapse || !isMobileViewport()) return

    if (window.bootstrap && window.bootstrap.Collapse) {
      const instance = window.bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false })
      instance.hide()
      return
    }

    collapse.classList.remove('show', 'collapsing')
    collapse.classList.add('collapse')

    const toggler = document.querySelector('.navbar-toggler')
    if (toggler) {
      toggler.setAttribute('aria-expanded', 'false')
      toggler.classList.add('collapsed')
    }

    setMobileNavVisible(false)
    scheduleMobileNavSceneRelease()
    scheduleMobileNavRelease()
  }

  function syncMobileNavState() {
    const collapse = getNavbarCollapse()
    if (!collapse) return

    if (!isMobileViewport()) {
      collapse.classList.remove('show', 'collapsing')
      collapse.classList.add('collapse')

      const toggler = document.querySelector('.navbar-toggler')
      if (toggler) {
        toggler.setAttribute('aria-expanded', 'false')
        toggler.classList.add('collapsed')
      }

      setMobileNavOpen(false)
      unlockPageScroll()
      return
    }

    const isOpen =
      collapse.classList.contains('show') || collapse.classList.contains('collapsing')

    setMobileNavOpen(isOpen)
    setMobileNavVisible(collapse.classList.contains('show'))
    if (isOpen) {
      lockPageScroll()
    } else {
      unlockPageScroll()
    }
  }

  function setupMobileNav() {
    const collapse = getNavbarCollapse()
    if (!collapse) return

    const toggler = document.querySelector('.navbar-toggler')
    if (toggler && toggler.hasAttribute('onclick')) {
      toggler.removeAttribute('onclick')
    }

    collapse.addEventListener('show.bs.collapse', function () {
      if (isMobileViewport()) {
        lockPageScroll()
        setMobileNavOpen(true)
        withNextPaint(function () {
          setMobileNavVisible(true)
        })
      }
    })

    collapse.addEventListener('shown.bs.collapse', function () {
      if (isMobileViewport()) {
        setMobileNavOpen(true)
        setMobileNavVisible(true)
      }
    })

    collapse.addEventListener('hide.bs.collapse', function () {
      if (isMobileViewport()) {
        setMobileNavVisible(false)
        scheduleMobileNavSceneRelease()
        scheduleMobileNavRelease()
      }
    })

    collapse.addEventListener('transitionend', function (event) {
      if (!isMobileViewport()) return
      if (event.target !== collapse || event.propertyName !== 'opacity') return
      if (document.documentElement.classList.contains('mobile-nav-visible')) return
      if (!document.documentElement.classList.contains('mobile-nav-open')) return

      releaseMobileNavScene()
    })

    collapse.addEventListener('hidden.bs.collapse', function () {
      finalizeMobileNavClose()
    })

    collapse.addEventListener('click', function (event) {
      if (event.target.closest('.nav-link')) {
        closeMobileNav()
      }
    })

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeMobileNav()
      }
    })

    syncMobileNavState()
  }

  window.addEventListener('scroll', syncNavState, { passive: true });
  window.addEventListener('resize', function () {
    syncMobileNavState()
    syncNavState()
  }, { passive: true });
  window.addEventListener('load', function () {
    setupMobileNav()
    syncMobileNavState()
    syncNavState()
  });
  syncNavState();
})();
</script>
